services:
  islasgeci: 
    build:
      context: .
      dockerfile: Dockerfile
    image: islasgeci/descarga_datos:latest
    command: bash
    environment:
      BITBUCKET_API_TOKEN: $BITBUCKET_API_TOKEN
      BITBUCKET_PASSWORD: $BITBUCKET_PASSWORD
      BITBUCKET_USERNAME: $BITBUCKET_USERNAME
    volumes:
      - $PWD:/workdir
